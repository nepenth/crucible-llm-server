name: Build iOS IPA

on:
  push:
    branches: [master, ios14-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find and select Xcode with iOS SDK
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          # Pin Xcode 16.4: Xcode 26+ only supports iOS 15+ deployment targets,
          # and this build must run on iOS 14.7.1.
          XCODE_PATH=/Applications/Xcode_16.4.app
          test -d "$XCODE_PATH" || { echo "::error::$XCODE_PATH not found on runner"; exit 1; }
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iphoneos SDK minimum deployment target: $(plutil -extract SupportedTargets.iphoneos.MinimumDeploymentTarget raw "$SDK/SDKSettings.plist")"

      - name: Build llama.cpp xcframework
        run: |
          cd llama.cpp
          chmod +x build-xcframework.sh
          IOS_MIN_OS_VERSION=14.0 ./build-xcframework.sh
          ls -la build-apple/llama.xcframework/

      - name: Check Metal shaders compile for iOS 14 (Metal 2.3)
        continue-on-error: true
        run: |
          # The app compiles this embedded source on-device at runtime; on iOS 14 the
          # language level is Metal 2.3. iPhone 11 (Apple6) sets GGML_METAL_HAS_BF16.
          SRC=$(find llama.cpp/build-ios-device -name ggml-metal-embed.metal | head -1)
          echo "Source: $SRC"
          xcrun -sdk iphoneos metal -c -std=ios-metal2.3 -target air64-apple-ios14.0 \
            -DGGML_METAL_EMBED_LIBRARY=1 -DGGML_METAL_HAS_BF16=1 \
            "$SRC" -o "$RUNNER_TEMP/ggml-ios14.air"
          echo "Metal 2.3 compile OK"

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project llama.swiftui.xcodeproj \
            -scheme llama.swiftui \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CrucibleLLM.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrucibleLLM
          path: CrucibleLLM.ipa

      - name: Verify iOS 14 deployment target
        run: |
          APP=$(ls -d Payload/*.app | head -1)
          BIN="$APP/$(plutil -extract CFBundleExecutable raw "$APP/Info.plist")"
          FW="$APP/Frameworks/llama.framework/llama"
          MINOS_PLIST=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          echo "App: $APP"
          echo "Info.plist MinimumOSVersion: $MINOS_PLIST"
          echo "Frameworks:"; ls "$APP/Frameworks"
          echo "Swift runtime linkage:"; otool -L "$BIN" | grep -i swift || true
          fail=0
          [ "$MINOS_PLIST" = "14.0" ] || { echo "::error::MinimumOSVersion is $MINOS_PLIST"; fail=1; }
          for f in "$BIN" "$FW"; do
            echo "== $f"; xcrun vtool -show-build "$f"
            xcrun vtool -show-build "$f" | grep -qE 'minos 14\.0$' || { echo "::error::$f minos is not 14.0"; fail=1; }
          done
          exit $fail
